name: Build Android App

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK components (Jelly Bean / API 16)
        run: |
          yes | sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;21.4.7075529" \
            "cmake;3.22.1"

      - name: Apply ggml API 16 patches
        run: git -C llama.cpp-rpc apply --check patches/ggml-android-api16.patch && git -C llama.cpp-rpc apply patches/ggml-android-api16.patch

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload Jelly Bean debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-jellybean-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
